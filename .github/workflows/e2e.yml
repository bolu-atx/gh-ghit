name: e2e
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tmux-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache the apt debs so a flaky Ubuntu mirror (DNS blips seen
      # twice on #72) can't fail setup: cache hits install with no
      # network, misses fall back to apt once and repopulate it.
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tmux xvfb xclip
          version: "1.0"
      - run: cargo build
      # xvfb-run provides the X server xclip needs, so yank really copies
      # and the toasts assert on content instead of "copy failed".
      - run: xvfb-run -a bash scripts/e2e/run.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-frames
          path: /tmp/ghit-e2e-frames/
          retention-days: 7

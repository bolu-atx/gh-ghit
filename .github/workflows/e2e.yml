name: e2e
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  # A push to main that is a squash-merge of a green PR may re-test a
  # tree that already passed. Skip only when the merged PR's head has
  # the exact same tree and every check on it passed. The last "(#N)"
  # in the subject names the PR (GitHub appends it; a PR title can
  # hold an earlier one). Anything else always runs.
  tip-check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.tip.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          NUM=$(git log -1 --format=%s | grep -oE '\(#[0-9]+\)' | tr -d '(#)' | tail -1)
          if [ -z "$NUM" ]; then echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          HEAD=$(gh pr view "$NUM" --json headRefOid --jq .headRefOid 2>/dev/null || true)
          if [ -z "$HEAD" ]; then echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          # A PR head that is behind main squashes to a different tree.
          HEAD_TREE=$(gh api "repos/${{ github.repository }}/git/commits/$HEAD" --jq .tree.sha 2>/dev/null || true)
          if [ "$HEAD_TREE" != "$(git rev-parse 'HEAD^{tree}')" ]; then echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          # Check-runs (not commit statuses): skip only when the head has
          # at least one run and every run completed green.
          BAD=$(gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs" --jq '[.check_runs[] | select(.status != "completed" or .conclusion != "success")] | length' 2>/dev/null || echo 1)
          TOTAL=$(gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs" --jq '.total_count' 2>/dev/null || echo 0)
          if [ "$TOTAL" -ge 1 ] && [ "$BAD" = "0" ]; then echo "skip=true" >>"$GITHUB_OUTPUT"; else echo "skip=false" >>"$GITHUB_OUTPUT"; fi
  # Fast gate: lint and unit tests fail in about a minute, before the
  # slower e2e job spends a runner.
  check:
    needs: tip-check
    if: needs.tip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  # Known-vulnerability scan of Cargo.lock against the RustSec
  # advisory database. Not a required check, so a new advisory does
  # not block unrelated PRs, but it shows red on the PR.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
  # Job keeps the historic tmux-drive name: the main-branch ruleset
  # requires exactly that check, and drive mode needs no tmux at all.
  # It waits for `check` and stops at once if lint or unit tests failed.
  # It fails instead of skipping because a skipped required check counts
  # as passed.
  tmux-drive:
    needs: [tip-check, check]
    if: always() && needs.tip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stop when lint or unit tests failed
        if: needs.check.result != 'success'
        run: |
          echo "check job result: ${{ needs.check.result }}; e2e not run"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: command -v python3 && python3 --version
      - run: cargo build
      # Drive mode boots headless on a Unix socket: no terminal, no X,
      # no tmux, no clipboard tools. Yank scenarios copy through a shim
      # (see scripts/e2e/run.sh) so the toasts assert on content.
      - run: bash scripts/e2e/run.sh
        env:
          E2E_FAKE_CLIPBOARD: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-frames
          path: /tmp/ghit-e2e-frames/
          retention-days: 7

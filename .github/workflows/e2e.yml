name: e2e
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tmux-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y tmux xvfb xclip
      - run: cargo build
      # xvfb-run provides the X server xclip needs, so yank really copies
      # and the toasts assert on content instead of "copy failed".
      - run: xvfb-run -a bash scripts/e2e/run.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-frames
          path: /tmp/ghit-e2e-frames/
          retention-days: 7

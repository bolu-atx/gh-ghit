name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: amd64
            exe: .exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        # Asset names must end with {os}-{arch} (+ .exe on Windows)
        # for `gh extension install` to pick them up.
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ghit${{ matrix.exe }}" \
            "dist/gh-ghit-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gh-ghit-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" --title "$tag" --generate-notes "${flags[@]}"
          fi
          gh release upload "$tag" dist/* --clobber

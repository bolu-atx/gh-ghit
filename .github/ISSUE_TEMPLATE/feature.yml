name: Feature request
description: Suggest new behavior for ghit.
labels: [feature, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should ghit do? Keys, panes and layout if you have an opinion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: dropdown
    id: pr
    attributes:
      label: Will you send a PR?
      description: Wait for the `accepted` label before you start.
      options:
        - "No"
        - "Yes, after it is accepted"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true

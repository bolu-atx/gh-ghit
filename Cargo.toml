[package]
name = "ghit"
version = "0.1.1"
edition = "2021"
description = "Terminal viewer for GitHub issues and PRs, backed by the gh CLI"
license = "MIT"
repository = "https://github.com/bolu-atx/gh-ghit"
keywords = ["github", "issues", "tui"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
regex = "1"
open = "5"
tui-markdown = "0.3"

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
members = ["crates/ghit-core", "crates/ghit-tui", "crates/ghit"]

[workspace.package]
version = "0.14.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/bolu-atx/gh-ghit"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
regex = "1"
open = "5"
tui-markdown = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
ghit-core = { path = "crates/ghit-core" }
ghit-tui = { path = "crates/ghit-tui" }

[package]
name = "ghit"
version = "0.1.0"
edition = "2021"
description = "Terminal viewer for GitHub issues and PRs, backed by the gh CLI"
license = "MIT"
repository = "https://github.com/bolu-atx/gh-ghit"
keywords = ["github", "issues", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
open = "5"

[dev-dependencies]
tempfile = "3"
